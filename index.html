<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проявка · Метаданные фото</title>
<link rel="stylesheet" href="styles.css">
<!-- exif-js v2.3.0 (MIT License) — https://github.com/exif-js/exif-js -->
<script src="exif.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Прояв<span>ка</span></h1>
    <div class="tag">EXIF · IPTC · файловые данные</div>
  </header>

  <div class="sprockets" id="sprocketsTop"></div>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="dropzone-inner">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p id="dzText">Перетащите фотографию сюда или нажмите, чтобы выбрать файл</p>
      <small>JPEG хранит EXIF полностью · PNG и WebP обычно без EXIF</small>
      <div class="client-note">Все данные обрабатываются локально в браузере — файл никуда не отправляется</div>
      <div class="geo-status" id="geoStatus"></div>
    </div>
  </div>

  <div class="sprockets" id="sprocketsBottom"></div>

  <button class="geo-btn" id="geoBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round"/>
    </svg>
    Определить моё местоположение
  </button>

  <div class="stage" id="stage">
    <div>
      <div class="frame">
        <img id="preview" alt="Предпросмотр">
      </div>
      <div class="filename">
        <b id="fname">—</b>
        <span id="fmeta"></span>
      </div>
      <button class="reset-link" id="resetBtn">← загрузить другое фото</button>
    </div>

    <div class="groups" id="groups"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
