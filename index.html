<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проявка · Метаданные фото</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<style>
  :root{
    --bg: #17140f;
    --panel: #211d17;
    --panel-2: #2a251d;
    --hair: #3c352a;
    --text: #e9e2d2;
    --muted: #9a8f7a;
    --amber: #d98a3d;
    --amber-dim: #8a5a26;
    --red: #a8402c;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  @font-face{
    font-family:'Archivo';
    src: local('Archivo');
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100%;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(217,138,61,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,138,61,0.04), transparent 45%);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--hair);
    padding-bottom:18px;
    margin-bottom:36px;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
  }
  header h1 span{
    color:var(--amber);
  }
  header .tag{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  /* film sprocket strip */
  .sprockets{
    display:flex;
    justify-content:space-between;
    padding:0 4px;
    margin-bottom:6px;
  }
  .sprockets span{
    width:9px;
    height:6px;
    background:var(--hair);
    border-radius:1px;
  }

  .dropzone{
    position:relative;
    border:1px solid var(--hair);
    background:var(--panel);
    padding:40px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--amber-dim);
    background:var(--panel-2);
  }
  .dropzone input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .dropzone .icon{
    width:36px;
    height:36px;
    margin:0 auto 14px;
    border:1px solid var(--muted);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
  }
  .dropzone .icon svg{width:16px;height:16px;}
  .dropzone p{
    margin:0 0 4px;
    font-size:15px;
    color:var(--text);
  }
  .dropzone small{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
  }

  .stage{
    display:none;
    margin-top:32px;
    gap:28px;
  }
  .stage.show{
    display:grid;
    grid-template-columns: 260px 1fr;
  }
  @media (max-width: 680px){
    .stage.show{grid-template-columns: 1fr;}
  }

  .frame{
    border:1px solid var(--hair);
    background:#000;
    padding:10px;
    position:relative;
  }
  .frame::before, .frame::after{
    content:'';
    position:absolute;
    left:-1px; right:-1px;
    height:10px;
    background-image: repeating-linear-gradient(90deg, transparent 0 4px, var(--bg) 4px 8px);
    background-color:#000;
  }
  .frame::before{ top:-11px; }
  .frame::after{ bottom:-11px; }
  .frame img{
    display:block;
    width:100%;
    height:auto;
    max-height:340px;
    object-fit:contain;
    background:#000;
  }
  .filename{
    margin-top:16px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    word-break:break-all;
    line-height:1.5;
  }
  .filename b{
    color:var(--text);
    font-weight:400;
    display:block;
    font-size:13px;
    margin-bottom:4px;
  }

  .reset-link{
    display:inline-block;
    margin-top:14px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    text-decoration:none;
    border-bottom:1px solid var(--amber-dim);
    cursor:pointer;
    background:none;
    border-top:none;border-left:none;border-right:none;
    padding:0 0 1px;
  }
  .reset-link:hover{ color:#f0ac66; }

  .groups{
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .group h2{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--amber);
    margin:0 0 8px;
    padding-bottom:8px;
    border-bottom:1px solid var(--hair);
    display:flex;
    justify-content:space-between;
  }
  .group h2 .count{
    color:var(--muted);
    letter-spacing:0;
  }
  .row{
    display:grid;
    grid-template-columns: 160px 1fr;
    gap:12px;
    padding:6px 0;
    border-bottom:1px solid rgba(60,53,42,0.5);
    font-size:13px;
  }
  .row:last-child{border-bottom:none;}
  .row .k{
    color:var(--muted);
    font-family:var(--mono);
    font-size:11.5px;
    padding-top:1px;
  }
  .row .v{
    color:var(--text);
    font-family:var(--mono);
    word-break:break-word;
  }
  .row .v a{
    color:var(--amber);
    text-decoration:none;
    border-bottom:1px solid var(--amber-dim);
  }

  .empty-note{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    padding:10px 0;
  }
  .warn{
    font-family:var(--mono);
    font-size:12px;
    color:var(--red);
    background:rgba(168,64,44,0.08);
    border:1px solid rgba(168,64,44,0.3);
    padding:10px 12px;
    margin-top:10px;
  }

  .raw-toggle{
    margin-top:6px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .raw-toggle:hover{ color:var(--amber); }
  .raw-box{
    display:none;
    margin-top:10px;
    background:var(--panel);
    border:1px solid var(--hair);
    padding:14px;
    max-height:280px;
    overflow:auto;
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .raw-box.show{display:block;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--hair);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Прояв<span>ка</span></h1>
    <div class="tag">EXIF · IPTC · файловые данные</div>
  </header>

  <div class="sprockets" id="sprocketsTop"></div>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p id="dzText">Перетащите фотографию сюда или нажмите, чтобы выбрать файл</p>
    <small>JPEG хранит EXIF полностью · PNG и WebP обычно без EXIF</small>
  </div>

  <div class="sprockets" id="sprocketsBottom"></div>

  <div class="stage" id="stage">
    <div>
      <div class="frame">
        <img id="preview" alt="Предпросмотр">
      </div>
      <div class="filename">
        <b id="fname">—</b>
        <span id="fmeta"></span>
      </div>
      <button class="reset-link" id="resetBtn">← загрузить другое фото</button>
    </div>

    <div class="groups" id="groups"></div>
  </div>

</div>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const stage = document.getElementById('stage');
  const preview = document.getElementById('preview');
  const fname = document.getElementById('fname');
  const fmeta = document.getElementById('fmeta');
  const groupsEl = document.getElementById('groups');
  const dzText = document.getElementById('dzText');
  const resetBtn = document.getElementById('resetBtn');

  function sprockets(el, n){
    el.innerHTML = '';
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      el.appendChild(s);
    }
  }
  function fillSprockets(){
    const n = Math.max(10, Math.floor(window.innerWidth / 30));
    sprockets(document.getElementById('sprocketsTop'), n);
    sprockets(document.getElementById('sprocketsBottom'), n);
  }
  fillSprockets();
  window.addEventListener('resize', fillSprockets);

  ['dragenter','dragover'].forEach(evt=>{
    dropzone.addEventListener(evt, e=>{
      e.preventDefault();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(evt=>{
    dropzone.addEventListener(evt, e=>{
      e.preventDefault();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleFile(f);
  });
  fileInput.addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0];
    if(f) handleFile(f);
  });
  resetBtn.addEventListener('click', ()=>{
    stage.classList.remove('show');
    fileInput.value = '';
    dzText.textContent = 'Перетащите фотографию сюда или нажмите, чтобы выбрать файл';
  });

  function formatBytes(bytes){
    if(bytes === 0) return '0 Б';
    const units = ['Б','КБ','МБ','ГБ'];
    const i = Math.floor(Math.log(bytes)/Math.log(1024));
    return (bytes/Math.pow(1024,i)).toFixed(i===0?0:1) + ' ' + units[i];
  }

  function formatDate(d){
    try{
      return new Date(d).toLocaleString('ru-RU', {
        day:'2-digit', month:'2-digit', year:'numeric',
        hour:'2-digit', minute:'2-digit', second:'2-digit'
      });
    }catch(e){ return String(d); }
  }

  function dmsToDecimal(dms, ref){
    if(!dms || dms.length < 3) return null;
    let deg = dms[0] + dms[1]/60 + dms[2]/3600;
    if(ref === 'S' || ref === 'W') deg = -deg;
    return deg;
  }

  function exposureFraction(v){
    if(v == null) return null;
    if(v >= 1) return v.toFixed(1) + ' с';
    const denom = Math.round(1/v);
    return '1/' + denom + ' с';
  }

  function addGroup(title, rows){
    if(!rows || rows.length === 0) return;
    const g = document.createElement('div');
    g.className = 'group';
    const h = document.createElement('h2');
    h.innerHTML = '<span>'+title+'</span><span class="count">'+rows.length+'</span>';
    g.appendChild(h);
    rows.forEach(([k,v])=>{
      if(v === undefined || v === null || v === '') return;
      const row = document.createElement('div');
      row.className = 'row';
      const kEl = document.createElement('div');
      kEl.className = 'k';
      kEl.textContent = k;
      const vEl = document.createElement('div');
      vEl.className = 'v';
      if(v instanceof Node){
        vEl.appendChild(v);
      } else {
        vEl.textContent = v;
      }
      row.appendChild(kEl);
      row.appendChild(vEl);
      g.appendChild(row);
    });
    groupsEl.appendChild(g);
  }

  function handleFile(file){
    if(!file.type.startsWith('image/')){
      alert('Пожалуйста, выберите файл изображения.');
      return;
    }

    const url = URL.createObjectURL(file);
    preview.src = url;
    fname.textContent = file.name || '(без имени)';
    fmeta.textContent = (file.type || 'неизвестный тип') + ' · ' + formatBytes(file.size);

    groupsEl.innerHTML = '';
    stage.classList.add('show');

    // File info group
    const fileRows = [
      ['Имя файла', file.name || '—'],
      ['Тип MIME', file.type || '—'],
      ['Размер', formatBytes(file.size)],
      ['Изменён', file.lastModified ? formatDate(file.lastModified) : '—'],
    ];

    // Dimensions once image loads
    const imgForDims = new Image();
    imgForDims.onload = function(){
      addGroup('Файл', fileRows.concat([
        ['Разрешение', imgForDims.naturalWidth + ' × ' + imgForDims.naturalHeight + ' px'],
        ['Соотношение сторон', (imgForDims.naturalWidth/imgForDims.naturalHeight).toFixed(3)]
      ]));
      readExif(file);
    };
    imgForDims.onerror = function(){
      addGroup('Файл', fileRows);
      readExif(file);
    };
    imgForDims.src = url;
  }

  function readExif(file){
    if(typeof EXIF === 'undefined'){
      addGroup('EXIF', []);
      const note = document.createElement('div');
      note.className = 'warn';
      note.textContent = 'Библиотека чтения EXIF не загрузилась (нет соединения с CDN). Показаны только файловые данные.';
      groupsEl.appendChild(note);
      return;
    }

    EXIF.getData(file, function(){
      const all = EXIF.getAllTags(this);

      if(!all || Object.keys(all).length === 0){
        const note = document.createElement('div');
        note.className = 'empty-note';
        note.textContent = 'EXIF-данные не найдены в этом файле (часто бывает для PNG, WebP, скриншотов или фото, прошедших через мессенджеры/соцсети).';
        groupsEl.appendChild(note);
        return;
      }

      // Camera
      addGroup('Камера', [
        ['Производитель', all.Make],
        ['Модель', all.Model],
        ['Объектив', all.LensModel],
        ['ПО', all.Software],
      ]);

      // Exposure / shooting settings
      addGroup('Съёмка', [
        ['Дата съёмки', all.DateTimeOriginal || all.DateTime],
        ['Выдержка', exposureFraction(all.ExposureTime)],
        ['Диафрагма', all.FNumber ? 'f/' + all.FNumber : null],
        ['ISO', all.ISOSpeedRatings],
        ['Фокусное расстояние', all.FocalLength ? all.FocalLength + ' мм' : null],
        ['Экспокоррекция', (all.ExposureBiasValue !== undefined) ? all.ExposureBiasValue + ' EV' : null],
        ['Вспышка', all.Flash !== undefined ? (all.Flash % 2 === 1 ? 'сработала' : 'не сработала') : null],
        ['Баланс белого', all.WhiteBalance === 0 ? 'авто' : (all.WhiteBalance === 1 ? 'ручной' : null),],
        ['Ориентация', all.Orientation],
      ]);

      // GPS
      let gpsRows = [];
      if(all.GPSLatitude && all.GPSLongitude){
        const lat = dmsToDecimal(all.GPSLatitude, all.GPSLatitudeRef);
        const lon = dmsToDecimal(all.GPSLongitude, all.GPSLongitudeRef);
        if(lat !== null && lon !== null){
          const link = document.createElement('a');
          link.href = 'https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=15/'+lat+'/'+lon;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = lat.toFixed(6) + ', ' + lon.toFixed(6);
          gpsRows.push(['Координаты', link]);
        }
        if(all.GPSAltitude !== undefined){
          gpsRows.push(['Высота', all.GPSAltitude.toFixed ? all.GPSAltitude.toFixed(1) + ' м' : all.GPSAltitude + ' м']);
        }
      }
      addGroup('Геоданные', gpsRows);

      // Raw / other tags toggle
      const rawKeys = Object.keys(all);
      if(rawKeys.length){
        const toggleWrap = document.createElement('div');
        const toggle = document.createElement('div');
        toggle.className = 'raw-toggle';
        toggle.textContent = '▸ показать все ' + rawKeys.length + ' необработанных тегов';
        const box = document.createElement('div');
        box.className = 'raw-box';
        const lines = rawKeys.sort().map(k=>{
          let val = all[k];
          if(val && val.numerator !== undefined) val = val.numerator + '/' + val.denominator;
          if(Array.isArray(val)) val = val.join(', ');
          return k + ': ' + val;
        });
        box.textContent = lines.join('\n');
        toggle.addEventListener('click', ()=>{
          const isShown = box.classList.toggle('show');
          toggle.textContent = (isShown ? '▾ скрыть' : '▸ показать все ') + (isShown ? '' : rawKeys.length + ' необработанных тегов');
        });
        toggleWrap.appendChild(toggle);
        toggleWrap.appendChild(box);
        groupsEl.appendChild(toggleWrap);
      }
    });
  }
})();
</script>
</body>
</html>
